<section class="master-form"><h2>Add Process</h2><form [formGroup]="form" (ngSubmit)="onSubmit()"><label for="master-process-code">Process code</label><input id="master-process-code" formControlName="code" placeholder="e.g. PROC-005"><label for="master-process-name">Process name</label><input id="master-process-name" formControlName="name" placeholder="Enter process name"><button type="submit">Add Process</button></form></section>
