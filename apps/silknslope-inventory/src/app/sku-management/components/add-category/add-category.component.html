<section class="master-form"><h2>Add Category</h2><form [formGroup]="form" (ngSubmit)="onSubmit()"><label for="master-category-code">Category code</label><input id="master-category-code" formControlName="code" placeholder="e.g. CAT-002"><label for="master-category-name">Category name</label><input id="master-category-name" formControlName="name" placeholder="Enter category name"><button type="submit">Add Category</button></form></section>
