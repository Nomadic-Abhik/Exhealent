<section class="add-distributor">
  <h3>{{ isEditMode ? 'Edit Distributor' : 'Add Distributor' }}</h3>

  <form class="distributor-form" [formGroup]="distributorForm" (ngSubmit)="onSubmit()">
    <div *ngIf="isEditMode" class="field-group">
      <label for="code">Code</label>
      <input id="code" formControlName="code" type="text" readonly />
    </div>

    <div class="field-group">
      <label for="name">Name</label>
      <input id="name" formControlName="name" type="text" placeholder="Enter distributor name" />
    </div>

    <div class="field-group">
      <label for="phone">Phone Number</label>
      <input id="phone" formControlName="phone" type="tel" placeholder="Enter phone number" />
    </div>

    <div class="field-group">
      <label for="start-date">Start Date</label>
      <input id="start-date" formControlName="startDate" type="date" />
    </div>

    <div class="field-group">
      <label for="end-date">End Date</label>
      <input id="end-date" formControlName="endDate" type="date" />
    </div>

    <div class="field-group">
      <label for="active">Active</label>
      <select id="active" formControlName="active">
        <option [ngValue]="true">Yes</option>
        <option [ngValue]="false">No</option>
      </select>
    </div>

    <div class="field-group">
      <label for="promo">Promo Code</label>
      <input
        id="promo"
        formControlName="promo"
        type="text"
        pattern="[A-Za-z0-9]+"
        title="Promo code must be alphanumeric"
        placeholder="e.g. PROMO12"
      />
    </div>

    <div class="field-group">
      <label for="commission-percent">Commission %</label>
      <input id="commission-percent" formControlName="commissionPercent" type="number" placeholder="0" />
    </div>

    <div class="field-group">
      <label for="total-commission">Total Commission</label>
      <input id="total-commission" formControlName="totalCommission" type="number" [readonly]="isEditMode" placeholder="0" />
    </div>

    <div class="field-group">
      <label for="unpaid-commission">Unpaid Commission</label>
      <input id="unpaid-commission" formControlName="unpaidCommission" type="number" [readonly]="isEditMode" placeholder="0" />
    </div>

    <div class="form-actions">
      <button class="submit-btn" type="submit" [disabled]="distributorForm.invalid">{{ isEditMode ? 'Save Changes' : 'Save Distributor' }}</button>
      <button *ngIf="isEditMode" class="pay-btn" type="button">Pay</button>
    </div>
  </form>
</section>
