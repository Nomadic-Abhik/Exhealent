<section class="form-panel">
  <div class="panel-heading"><span class="step-mark">+</span><div><h2>Add SKU mapping</h2><p>Link a product code to its process, category, and product name.</p></div></div>
  <form [formGroup]="skuForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="field-group"><label for="add-product-code">Product code</label><select id="add-product-code" formControlName="productCode"><option value="" disabled>Select product code</option><option *ngFor="let code of productCodeMasterList" [value]="code">{{ code }}</option></select></div>
    <div class="field-group"><label for="add-process">Process</label><select id="add-process" formControlName="processCode"><option value="" disabled>Select process</option><option *ngFor="let process of processMasterList" [value]="process.code">{{ process.name }}</option></select></div>
    <div class="field-group"><label for="add-category">Category</label><select id="add-category" formControlName="categoryCode"><option value="" disabled>Select category</option><option *ngFor="let category of categoryMasterList" [value]="category.code">{{ category.name }}</option></select></div>
    <div class="field-group"><label for="add-product-name">Product name</label><select id="add-product-name" formControlName="productName"><option value="" disabled>Select product name</option><option *ngFor="let name of productNameMasterList" [value]="name">{{ name }}</option></select></div>
    <button class="primary-button" type="submit">Add SKU mapping</button>
  </form>
</section>
